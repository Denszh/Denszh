name: Update gist with WakaTime stats
on:
  schedule:
    # Runs at 23:05am UTC+8
    - cron: '05 15 * * *'
  workflow_dispatch:
jobs:
  update-readme:
    name: Update Readme with Metrics
    runs-on: ubuntu-latest
    steps:
      - uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # time spent (This Week I Spent My Time On)
          SHOW_TIME: "False"
          SHOW_LANGUAGE: "False"
          SHOW_EDITORS: "False"
          # OS
          SHOW_OS: "False"
          # projects
          SHOW_PROJECTS: "False"
          # info
          SHOW_SHORT_INFO: "False"
          # show shape
          SYMBOL_VERSION: 1
          # debug message
          DEBUG_LOGGING: "False"
          # code lines
          SHOW_LINES_OF_CODE: "True"
          # repos
          SHOW_LANGUAGE_PER_REPO: "False"
          # chart
          SHOW_LOC_CHART: "False"
          # push name
          COMMIT_USERNAME: "Denszh"
          # EMAIL
          COMMIT_EMAIL: "denszhi@gmail.com"
      # waka-readme-stats 无法关闭昼夜/星期统计，提交后自动删除
      - name: Trim night owl & weekday stats
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 - <<'EOF'
          import re
          readme = open('README.md').read()
          new = re.sub(r"\*\*I'm a (?:Night|Early).*?```\n", "", readme, flags=re.S)
          new = re.sub(r"📅 \*\*I'm Most Productive on .*?```\n", "", new, flags=re.S)
          new = re.sub(r"\n?\s*Last Updated on .*", "", new)
          if new != readme:
              open('README.md','w').write(new)
              print('已清理 waka 多余区块')
          else:
              print('无需清理')
          EOF
          if ! git diff --quiet README.md; then
            git -c user.name="Denszh" -c user.email="denszhi@gmail.com" commit -am "chore: trim waka night/weekday stats"
            git push https://x-access-token:${GH_TOKEN}@github.com/Denszh/Denszh.git HEAD:main
          fi
